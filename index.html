// If a restock (direct or from an Expected Batch) names a product that doesn't exist yet in
// DATA.products, auto-create a minimal product record for it instead of silently losing the
// stock. Uses safe defaults (type 'Other', selling price 0) that the owner can fill in later
// on the Products tab. Returns true if a new product was created.
function ensureProductExists(name, opts={}){
  if(!name) return false;
  if(DATA.products.some(p=>p.name===name)) return false;
  DATA.products.push({
    name,
    type: 'Other',
    costPrice: opts.costPrice ?? null,
    sellingPrice: 0,
    reorderLevel: 10,
  });
  return true;
}

function saveRestock(idx){
  if(isStaff()) return;
  const product = document.getElementById('r_product').value.trim();
  const qty = Number(document.getElementById('r_qty').value)||0;
  if(!product || !qty){ alert('Product and quantity are required.'); return; }
  const existing = (idx!=null && idx>=0) ? DATA.restocks[idx] : null;
  const rec = {
    date: document.getElementById('r_date').value, product, qty,
    costPrice: Number(document.getElementById('r_cost').value)||null,
    supplier: document.getElementById('r_supplier').value.trim(),
    consignmentId: document.getElementById('r_consignment').value.trim(),
    createdAt: existing?.createdAt || new Date().toISOString(),
  };
  if(idx!=null && idx>=0) DATA.restocks[idx] = rec; else DATA.restocks.push(rec);

function printInvoice(invNo){
  const paper = document.getElementById('invoicePaper');
  if(!paper){ window.print(); return; }

  // Snapshot the current invoice exactly as shown (including any edits),
  // stripped of editable/interactive attributes for a clean static print.
  const clone = paper.cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  clone.querySelectorAll('[oninput]').forEach(el=>el.removeAttribute('oninput'));
  clone.querySelectorAll('input').forEach(inp=>{
    const span = document.createElement('span');
    span.textContent = inp.value !== '' ? inp.value : (inp.placeholder||'');
    inp.replaceWith(span);
  });

  const printCss = `
    :root{color-scheme:light only;}
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:#ffffff;color-scheme:light only;}
    body{font-family:'Inter',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .invoice-paper{
      --inv-espresso:#2E1A0F;--inv-espresso-soft:#4A2C18;--inv-gold:#C9A24B;
      --inv-gold-deep:#A67C27;--inv-cream:#FBF7EF;
      background:var(--inv-cream);color:var(--inv-espresso);border-radius:0;
      padding:0 0 34px;max-width:820px;margin:0 auto;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;

function recalcInvoiceItemRow(cellEl){
  const row = cellEl.closest('tr');
  const cells = row.children;
  if(cells.length < 6) return;
  const qty = parseFloat((cells[3].textContent||'').replace(/[^0-9.\-]/g,''))||0;
  const price = parseFloat((cells[4].textContent||'').replace(/[^0-9.\-]/g,''))||0;
  cells[5].textContent = fmtMoneyVisible(qty*price);
  recalcInvoiceSubtotalFromItems();
}

function recalcInvoiceSubtotalFromItems(){
  const body = document.getElementById('invItemsBody');
  const block = document.getElementById('invTotalsBlock');
  if(!body || !block) return;
  let subtotal = 0;
  body.querySelectorAll('tr').forEach(r=>{
    const cell = r.children[5];
    if(cell) subtotal += parseFloat((cell.textContent||'').replace(/[^0-9.\-]/g,''))||0;
  });
  block.dataset.subtotal = subtotal;
  const subtotalDisplay = document.getElementById('inv_subtotal_display');
  if(subtotalDisplay) subtotalDisplay.textContent = fmtMoneyVisible(subtotal);
  recalcInvoiceTotals();
}

function recalcInvoiceTotals(){
  const block = document.getElementById('invTotalsBlock');
  const subtotal = Number(block.dataset.subtotal)||0;
  const discount = Number(document.getElementById('inv_discount').value)||0;
  const delivery = Number(document.getElementById('inv_delivery').value)||0;
  const paid = Number(document.getElementById('inv_paid').value)||0;
  const totalDue = subtotal - discount + delivery;
  const balance = totalDue - paid;
  document.getElementById('inv_total_due').textContent = fmtMoneyVisible(totalDue);
  document.getElementById('inv_balance_due').textContent = fmtMoneyVisible(balance);
}

function getPeriodRange(granularity, refDate){
  const d = new Date(refDate); d.setHours(0,0,0,0);
  let start, end, label;
  if(granularity==='day'){
    start = new Date(d); end = new Date(d); end.setDate(end.getDate()+1);
    label = start.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  } else if(granularity==='week'){
    const dow = (d.getDay()+6)%7;
    start = new Date(d); start.setDate(d.getDate()-dow);
    end = new Date(start); end.setDate(start.getDate()+7);
    const endIncl = new Date(end); endIncl.setDate(end.getDate()-1);
    label = 'Week of '+start.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+endIncl.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  } else if(granularity==='year'){
    start = new Date(d.getFullYear(),0,1); end = new Date(d.getFullYear()+1,0,1);
    label = String(d.getFullYear());
  } else {
    start = new Date(d.getFullYear(),d.getMonth(),1); end = new Date(d.getFullYear(),d.getMonth()+1,1);
    label = start.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  }
  const span = end-start;
  const prevEnd = new Date(start), prevStart = new Date(start.getTime()-span);
  return {start,end,prevStart,prevEnd,label};
}
function inRange(dateStr, start, end){
  if(!dateStr) return false;
  const t = new Date(dateStr.length<=10 ? dateStr+'T00:00:00' : dateStr).getTime();
  if(isNaN(t)) return false;
  return t>=start.getTime() && t<end.getTime();
}
function pctChange(cur, prev){ if(!prev) return cur>0 ? null : 0; return ((cur-prev)/Math.abs(prev))*100; }
function trendBadge(pct, goodIsUp=true){
  if(pct===null) return '<span class="kpi-sub">new activity</span>';
  const up = pct>0.5, down = pct<-0.5;
  const cls = up ? (goodIsUp?'good':'warn') : down ? (goodIsUp?'warn':'good') : '';
  const arrow = up ? '▲' : down ? '▼' : '—';
  return `<div class="kpi-sub ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}% vs previous period</div>`;
}
function shiftReportPeriod(dir){
  const g=reportGranularity, d=new Date(reportRefDate);
  if(g==='day') d.setDate(d.getDate()+dir);
  else if(g==='week') d.setDate(d.getDate()+7*dir);
  else if(g==='year') d.setFullYear(d.getFullYear()+dir);
  else d.setMonth(d.getMonth()+dir);
  reportRefDate = d; render();
}
function setReportGranularity(g){ reportGranularity = g; reportRefDate = new Date(); render(); }
function renderReportView(){

  const {start,end,prevStart,prevEnd,label} = getPeriodRange(reportGranularity, reportRefDate);

  const ordersPrev = DATA.orders.filter(o=>inRange(o.date,prevStart,prevEnd));
  const paymentsIn = (DATA.payments||[]).filter(p=>inRange(p.date,start,end));
  const paymentsPrev = (DATA.payments||[]).filter(p=>inRange(p.date,prevStart,prevEnd));
  const leadsIn = DATA.leads.filter(l=>inRange(l.dateAdded,start,end));

  const sales = ordersIn.reduce((s,o)=>s+Number(o.total||0),0);
  const salesPrev = ordersPrev.reduce((s,o)=>s+Number(o.total||0),0);
  const collected = paymentsIn.reduce((s,p)=>s+Number(p.amount||0),0);

  const orderCount = ordersIn.length, orderCountPrev = ordersPrev.length;
  const avgOrder = orderCount ? sales/orderCount : 0;

  const firstOrderByCustomer = {};
  DATA.orders.forEach(o=>{ if(o.customer && o.date && (!firstOrderByCustomer[o.customer] || o.date<firstOrderByCustomer[o.customer])) firstOrderByCustomer[o.customer]=o.date; });
  const newCustomers = Object.values(firstOrderByCustomer).filter(d=>inRange(d,start,end)).length;

  const now = new Date();
  const staleLeads = DATA.leads.filter(l=>l.status==='New' && l.dateAdded && (now-new Date(l.dateAdded))/86400000>14);

  const salesChange = pctChange(sales, salesPrev);
  const suggestions = [];
  if(salesChange!==null && salesChange<=-15) suggestions.push(`Sales are down ${Math.abs(salesChange).toFixed(0)}% vs the previous ${reportGranularity} — a follow-up push with regular customers or a small promotion could help.`);
  if(salesChange!==null && salesChange>=15) suggestions.push(`Sales are up ${salesChange.toFixed(0)}% vs the previous ${reportGranularity} — good momentum. Make sure your best sellers are well stocked.`);
  if(outstanding>0.5) suggestions.push(`GHS ${outstanding.toLocaleString()} is still unpaid across open orders — a round of payment reminders could bring in real cash.`);

  if(conversionRate!==null && conversionRate<20 && newLeads>=3) suggestions.push(`Only ${conversionRate.toFixed(0)}% of new leads this ${reportGranularity} converted to a sale — following up sooner after first contact tends to help.`);
  if(staleLeads.length) suggestions.push(`${staleLeads.length} lead${staleLeads.length>1?'s have':' has'} sat as "New" for over 2 weeks — a follow-up call before they go cold could be worth it.`);
  if(orderCount===0) suggestions.push(`No orders were recorded in this ${reportGranularity}.`);

      </div>
    </div>
    <div class="report-printable" id="reportPrintArea">
      <div class="print-only" style="margin-bottom:16px;">
        <h2 style="margin:0 0 4px;">Go Plug Enterprise — Company Report</h2>

      </div>
      <div class="stat-grid">
        <div class="stat-card clickable" onclick="openReportSalesModal()"><div class="stat-label">Sales</div><div class="stat-value">${fmtMoney(sales)}</div>${trendBadge(salesChange,true)}<div class="kpi-sub">Tap for breakdown by order</div></div>
        <div class="stat-card clickable" onclick="openReportCollectedModal()"><div class="stat-label">Cash Collected</div><div class="stat-value good">${fmtMoney(collected)}</div>${trendBadge(pctChange(collected,collectedPrev),true)}<div class="kpi-sub">Tap for breakdown by payment</div></div>
        <div class="stat-card clickable" onclick="openReportOrdersModal()"><div class="stat-label">Orders</div><div class="stat-value">${orderCount}</div>${trendBadge(pctChange(orderCount,orderCountPrev),true)}<div class="kpi-sub">Tap for the list</div></div>
        <div class="stat-card clickable" onclick="openReportAvgOrderModal()"><div class="stat-label">Avg. Order Value</div><div class="stat-value">${fmtMoney(avgOrder)}</div><div class="kpi-sub">${label} · Tap for breakdown</div></div>

          const rows = Object.entries(buckets).map(([m,amt])=>`<tr style="cursor:pointer;" onclick="openReportCollectedModal('${m}')"><td>${m}${m==='Other'?' <span class="hint" style="font-weight:400;">(PayPal, Skrill, etc.)</span>':''}</td><td style="font-weight:600;">${fmtMoney(amt)}</td></tr>`);

function paymentMethodBucket(method){
  const m = String(method||'').trim();
  if(m==='Mobile Money') return 'Mobile Money';
  if(m==='Cash') return 'Cash';
  if(m==='Card') return 'Card';
  if(m==='Bank Transfer') return 'Bank Transfer';
  return 'Other'; // covers 'Other', 'Adjustment', 'Legacy (migrated)', PayPal, Skrill, and anything else not in the four buckets above
}

}
function openReportNewCustomersModal(){
  if(isStaff()) return;
  const {start,end,label} = reportPeriod();
  const firstOrderByCustomer = {};
  DATA.orders.forEach(o=>{ if(o.customer && o.date && (!firstOrderByCustomer[o.customer] || o.date<firstOrderByCustomer[o.customer])) firstOrderByCustomer[o.customer]=o.date; });
  const rows = Object.entries(firstOrderByCustomer).filter(([,d])=>inRange(d,start,end)).sort((a,b)=>(a[1]||'').localeCompare(b[1]||''));
  const bodyRows = rows.map(([name,date])=>`<tr>
    <td><a class="cust-link" onclick="closeModal();openCustomerDetail(${jsAttr(name)})">${name}</a></td>
    <td>${fmtDate(date)}</td>
  </tr>`);
  showModal(`
    <h3>New Customers — ${label}</h3>
    <div class="hint">${rows.length} customer${rows.length===1?'':'s'} placed their first order this period.</div>
    <div style="max-height:70vh;overflow:auto;margin-top:8px;" class="table-scroll">
      ${table(['Customer','First Order Date'], bodyRows, 'No new customers this period.')}
    </div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">Close</button></div>
  `, true);
}

function openReportOutstandingModal(){
  if(isStaff()) return;
  const rows = outstandingByCustomer();
  const total = rows.reduce((s,r)=>s+r.total,0);
  const bodyRows = rows.map(r=>{
    const manual = DATA.customers.find(x=>x.name===r.name) || {};
    const reminderMsg = `Hi ${r.name}, just a friendly reminder about your outstanding balance of ${fmtMoney(r.total)} with Go Plug Enterprise 👋`;
    return `<tr>
      <td><a class="cust-link" onclick="closeModal();openCustomerDetail(${jsAttr(r.name)})">${r.name}</a>${manual.phone?waButtonHtml(manual.phone, reminderMsg):''}</td>
      <td>${r.orders}</td>
      <td style="font-weight:600;">${fmtMoney(r.total)}</td>
    </tr>`;
  });
  showModal(`
    <h3>Outstanding Balance</h3>
    <div class="hint">${rows.length} client${rows.length===1?'':'s'} owe a total of ${fmtMoney(total)} across unpaid or partially paid orders (all-time, current snapshot).</div>
    <div style="max-height:70vh;overflow:auto;margin-top:8px;" class="table-scroll">
      ${table(['Client','Unpaid Orders','Amount Owed'], bodyRows, 'No outstanding balances right now.')}
    </div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">Close</button></div>
  `, true);
}

      <div class="card-head"><h3>Fix Legacy Payment Methods</h3></div>
      <div class="data-block">
        <div class="hint">${legacy.length} payment(s) totaling ${fmtMoney(total)} are labeled "Legacy (migrated)" — these were backfilled from old orders before the payment ledger existed, so the CRM doesn't know how they were actually paid. Finance can't credit them to any Cash &amp; Bank account (like MTN Mobile Money) until they're reclassified.</div>

    <div class="card">

      <div class="data-block">
        <div class="hint">Every save is now also kept on this PC — just in case Firebase ever fails. A copy is stored automatically in this browser, and you can optionally connect a real file on disk that updates itself every time something changes.</div>
        ${localBackupFileStatus === 'unsupported' ? `
          <div class="hint" style="margin-top:8px;">Real-file backup needs Chrome or Edge on a computer. The automatic browser backup above is active regardless.</div>
        ` : localBackupFileStatus === 'connected' ? `
          <div class="hint" style="margin-top:8px;color:var(--green);">✓ Connected to <b>${localBackupFileName}</b> — saved automatically on every change${localBackupLastSavedAt ? ' (last write: ' + localBackupLastSavedAt.toLocaleTimeString() + ')' : ''}.</div>

        <div class="btn-row">

          <label class="btn-ghost" style="cursor:pointer;">Import Products CSV<input type="file" accept=".csv,text/csv" style="display:none;" onchange="importProductsCSV(this)"></label>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Fix Product Name Mismatches</h3></div>

        </div>
      </div>
    </div>
  `;
}

/* ---------- router ---------- */
function render(){
  if(isStaff() && (currentView==='data' || currentView==='report')) currentView = 'dashboard';
  // If we're still on the same page (e.g. after saving/deleting/editing an item),
  // keep the scroll position instead of jumping back to the top of the list.
  const samePageRefresh = (currentView === lastRenderedView);
  const scrollY = window.scrollY;
  renderNav();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='customers') renderCustomers();
  else if(currentView==='customerDetail') renderCustomerDetail(selectedCustomerDetail);
  else if(currentView==='orders') renderOrders();
  else if(currentView==='invoices') renderInvoices();
  else if(currentView==='products') renderProducts();
  else if(currentView==='restocks') renderRestocks();
  else if(currentView==='leads') renderLeads();
  else if(currentView==='interactions') renderInteractions();
  else if(currentView==='report') renderReportView();
  else if(currentView==='data') renderDataView();
  const mainEl = document.getElementById('main');
  if(!samePageRefresh){
    mainEl.style.animation = 'none';
    void mainEl.offsetWidth;
    mainEl.style.animation = '';
  }
  if(samePageRefresh){
    window.scrollTo(0, scrollY);
  }else{
    window.scrollTo(0, 0);
  }
  lastRenderedView = currentView;
}

window.addEventListener('error', e=>{ console.warn('CRM app error (page kept visible):', e.message); });
try{ initLoginScreen(); }catch(e){ console.warn('initLoginScreen failed', e); }
try{
  firebaseInit();
}catch(fatal){
  console.error('Fatal startup error', fatal);
  const ls=document.getElementById('loginScreen');
  if(ls) ls.style.display='flex';
  setLoginError('Something went wrong starting the app: '+(fatal?.message||fatal)+'. Try reloading the page.');
}
